<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - iQIBLA Grand Opening</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS (via CDN for quick styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f3f4f6;
        }

        .font-heading {
            font-family: 'Playfair Display', serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>

<body class="text-gray-800">

    <!-- Login Section -->
    <div id="login-section" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-md w-full text-center">
            <img src="assets/iqibla_logo.png" alt="iQIBLA" class="h-16 mx-auto mb-6">
            <h2 class="text-2xl font-bold mb-2">Admin Login</h2>
            <p class="text-gray-500 mb-6">Masukkan PIN untuk mengakses dashboard data tamu.</p>
            <form id="login-form" class="space-y-4">
                <input type="password" id="admin-pin" placeholder="PIN Admin"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-transparent transition">
                <button type="submit"
                    class="w-full bg-gray-800 text-white font-bold py-3 rounded-lg hover:bg-gray-700 transition transform active:scale-95">
                    Masuk Dashboard
                </button>
            </form>
            <p id="login-error" class="hidden text-red-500 text-sm mt-3 font-semibold"></p>
        </div>
    </div>

    <!-- Dashboard Section (Hidden by default) -->
    <div id="dashboard-section" class="hidden min-h-screen pb-20">

        <!-- Header -->
        <header class="bg-white shadow-sm sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <img src="assets/iqibla_logo.png" alt="iQIBLA" class="h-10">
                    <h1 class="font-heading text-xl font-bold text-gray-800 hidden sm:block">Grand Opening Dashboard
                    </h1>
                </div>
                <button id="btn-logout" class="text-gray-500 hover:text-red-600 text-sm font-semibold">
                    Logout
                </button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <!-- Total Tamu -->
                <div class="glass-panel p-6 border-l-4 border-yellow-500">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Total Tamu (Orang)</p>
                            <p id="stat-guests" class="text-4xl font-bold text-gray-800 mt-1">-</p>
                        </div>
                        <div class="p-3 bg-yellow-100 rounded-full text-yellow-600">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
                                </path>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Kendaraan -->
                <div class="glass-panel p-6 border-l-4 border-green-600">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Kendaraan (Unit)</p>
                            <p id="stat-vehicles" class="text-4xl font-bold text-gray-800 mt-1">-</p>
                        </div>
                        <div class="p-3 bg-green-100 rounded-full text-green-600">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Konfirmasi -->
                <div class="glass-panel p-6 border-l-4 border-blue-500">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Konfirmasi Masuk</p>
                            <p id="stat-entries" class="text-4xl font-bold text-gray-800 mt-1">-</p>
                        </div>
                        <div class="p-3 bg-blue-100 rounded-full text-blue-600">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01">
                                </path>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Data Table -->
            <div class="glass-panel overflow-hidden">
                <div
                    class="px-6 py-4 border-b border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <span class="bg-red-800 text-white text-xs px-2 py-1 rounded">LIVE</span>
                        Data Reservasi Tamu
                    </h2>
                    <div class="flex gap-2">
                        <button onclick="exportToExel()"
                            class="bg-green-600 hover:bg-green-700 text-white font-medium px-4 py-2 rounded-lg flex items-center gap-2 text-sm transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                            Download Excel (.csv)
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-gray-600">
                        <thead class="bg-gray-50 text-gray-800 uppercase text-xs font-bold">
                            <tr>
                                <th class="px-6 py-4">Waktu</th>
                                <th class="px-6 py-4">Nama Tamu</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4 text-center">Jml</th>
                                <th class="px-6 py-4 text-center">Kendaraan</th>
                                <th class="px-6 py-4">Pesan / Doa</th>
                            </tr>
                        </thead>
                        <tbody id="guest-table-body" class="divide-y divide-gray-200">
                            <tr>
                                <td colspan="6" class="px-6 py-8 text-center text-gray-400 italic">
                                    ditunggu ya, sambil mnegucap ray ganteng 100x ...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script type="module">
        // Import Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // CONFIG: Copy from script.js manually or use module if possible.
        // For simplicity reusing strict config here.
        const firebaseConfig = {
            apiKey: "AIzaSyAG_UtEEjArsOW9rcDW470_8EQNltEo33E",
            authDomain: "real-time-comment-acb8f.firebaseapp.com",
            databaseURL: "https://real-time-comment-acb8f-default-rtdb.firebaseio.com",
            projectId: "real-time-comment-acb8f",
            appId: "1:808939789359:web:f2c41e6dfea70c89457ada"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- Logic Login ---
        const PIN = "rayganteng"; // PASSWORD ADMIN SEDERHANA
        const loginForm = document.getElementById('login-form');

        // Auto login check
        if (localStorage.getItem('iqibla_admin_auth') === 'true') {
            showDashboard();
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('admin-pin').value;
            if (input === PIN) {
                localStorage.setItem('iqibla_admin_auth', 'true');
                showDashboard();
            } else {
                document.getElementById('login-error').innerText = "PIN Salah cik hehe.";
                document.getElementById('login-error').classList.remove('hidden');
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.removeItem('iqibla_admin_auth');
            location.reload();
        });

        function showDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            loadData();
        }

        // --- Logic Data ---
        let allGuests = [];

        function loadData() {
            const rsvpRef = ref(db, 'reservasi'); // Node baru 'reservasi'
            onValue(rsvpRef, (snapshot) => {
                const data = snapshot.val();
                allGuests = [];
                let totalGuests = 0;
                let totalVehicles = 0;
                let totalEntries = 0;

                const tbody = document.getElementById('guest-table-body');
                tbody.innerHTML = '';

                if (data) {
                    Object.keys(data).forEach(key => {
                        allGuests.push(data[key]);
                    });

                    // Sort Newest First
                    allGuests.sort((a, b) => new Date(b.timestamp_sys || 0) - new Date(a.timestamp_sys || 0));

                    allGuests.forEach(guest => {
                        totalEntries++;
                        const count = parseInt(guest.guests) || 0;
                        if (guest.status.toLowerCase().includes('hadir')) {
                            totalGuests += count;
                        }
                        if (guest.vehicle && guest.vehicle.toLowerCase() === 'ya') {
                            totalVehicles++;
                        }

                        // Render Row
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50 transition";
                        tr.innerHTML = `
                            <td class="px-6 py-4 whitespace-nowrap text-gray-500 text-xs">${guest.timestamp || '-'}</td>
                            <td class="px-6 py-4 font-bold text-gray-900">${escapeHtml(guest.name)}</td>
                            <td class="px-6 py-4">
                                <span class="px-2 py-1 text-xs font-bold rounded-full ${getStatusColor(guest.status)}">
                                    ${escapeHtml(guest.status)}
                                </span>
                            </td>
                            <td class="px-6 py-4 text-center font-semibold">${guest.guests}</td>
                            <td class="px-6 py-4 text-center">
                                ${guest.vehicle === 'ya' ? '<span class="text-green-600 font-bold">✓ Ya</span>' : '<span class="text-gray-400">-</span>'}
                            </td>
                            <td class="px-6 py-4 text-xs text-gray-500 italic max-w-xs truncate">${escapeHtml(guest.doa || '-')}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">Belum ada data reservasi masuk.</td></tr>`;
                }

                // Update Stats
                document.getElementById('stat-entries').innerText = totalEntries;
                document.getElementById('stat-guests').innerText = totalGuests;
                document.getElementById('stat-vehicles').innerText = totalVehicles;
            });
        }

        function getStatusColor(status) {
            const s = status.toLowerCase();
            if (s.includes('hadir')) return 'bg-green-100 text-green-800';
            if (s.includes('tidak')) return 'bg-red-100 text-red-800';
            return 'bg-yellow-100 text-yellow-800';
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Export Function (Global Scope)
        window.exportToExel = function () {
            if (allGuests.length === 0) {
                alert("Tidak ada data untuk diexport!");
                return;
            }

            // CSV Header
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Waktu Input,Nama Tamu,Status Kehadiran,Jumlah Orang,Bawa Kendaraan,Pesan/Doa\n";

            // CSV Rows
            allGuests.forEach(row => {
                const cleanName = (row.name || '').replace(/,/g, " "); // Remove commas to prevent CSV break
                const cleanMsg = (row.doa || '').replace(/,/g, " ").replace(/\n/g, " ");

                const rowStr = `${row.timestamp},${cleanName},${row.status},${row.guests},${row.vehicle},${cleanMsg}`;
                csvContent += rowStr + "\n";
            });

            // Download Trigger
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Rekap_Reservasi_iQIBLA.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

    </script>
</body>

</html>
