<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Opening - iQIBLA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-animation"></div>

    <!-- Music Control -->
    <button id="music-control" class="music-btn paused">
        <span class="icon">🎵</span>
    </button>
    <div id="youtube-player" style="display:none;"></div>

    <main class="container">
        <!-- PAGE 1: Invitation (Video) -->
        <div id="page-video" class="page-section fade-in">
            <!-- <header id="header">
                <h1>Grand Opening</h1>
                <p class="subtitle">Nurokhim S.Ag, S.Pd</p>
            </header> -->

            <section class="invitation-gallery slideshow-container">
                <img src="invitation/1.svg" alt="Hal 1" class="invitation-slide fade">
                <img src="invitation/2.svg" alt="Hal 2" class="invitation-slide fade">
                <!-- <img src="invitation/3.svg" alt="Hal 3" class="invitation-slide fade"> -->
                <!-- <img src="invitation/4.svg" alt="Hal 4" class="invitation-slide fade"> -->

                <div class="invitation-slide fade" style="position: relative; padding-bottom: 20px;">
                    <!-- Image and Button Wrapper -->
                    <div style="position: relative;">
                        <img src="invitation/5.svg" alt="Hal 5" style="width: 100%; display: block;">

                        <button onclick="document.querySelector('[data-target=\'page-rsvp\']').click()" class="btn-wa"
                            style="border:none; cursor:pointer; position: absolute; bottom: 12%; left: 0; right: 0; margin: 0 auto; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
                            Konfirmasi Kehadiran
                        </button>

                        <a href="https://share.google/k7b84Hk3QBmnE0tF1" target="_blank" class="btn-location"
                            style="border:none; cursor:pointer; position: absolute; bottom: 6%; left: 0; right: 0; margin: 0 auto; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
                            📍 Lihat Lokasi
                        </a>
                    </div>

                    <!-- Recent Doa Section inside Last Slide -->
                    <div class="glass-card"
                        style="margin: 20px 15px; padding: 15px; background: rgba(255, 255, 255, 0.8);">
                        <h3
                            style="text-align: center; margin-bottom: 10px; font-size: 1.1rem; color: var(--primary-dark);">
                            Ucapan Terbaru</h3>
                        <div id="recent-doa-list">
                            <!-- Recent doas will be loaded here -->
                        </div>
                    </div>
                </div>
            </section>


        </div>

        <!-- PAGE 2: RSVP -->
        <div id="page-rsvp" class="page-section hidden">
            <section class="content-section">
                <div class="glass-card">
                    <h2>Konfirmasi Kehadiran</h2>
                    <p class="section-desc">Mohon isi form di bawah ini untuk konfirmasi kehadiran dan kirim doa.</p>
                    <form id="rsvp-form">
                        <div class="form-group">
                            <label for="rsvp-name">Nama</label>
                            <input type="text" id="rsvp-name" required placeholder="Nama Lengkap">
                        </div>
                        <div class="form-group">
                            <label for="rsvp-status">Kehadiran</label>
                            <select id="rsvp-status" required>
                                <option value="hadir">Hadir</option>
                                <option value="tidak_hadir">Berhalangan</option>
                                <option value="ragu">Mungkin Hadir</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="rsvp-guests">Jumlah Tamu</label>
                            <input type="number" id="rsvp-guests" min="1" max="5" value="1">
                        </div>
                        <div class="form-group">
                            <label for="rsvp-doa">Ucapan & Doa</label>
                            <textarea id="rsvp-doa" placeholder="Tuliskan doa atau ucapan selamat..."></textarea>
                        </div>
                        <button type="submit" class="btn-submit">Kirim Konfirmasi</button>
                    </form>
                </div>
            </section>


        </div>

        <!-- PAGE 3: Doa (Quote + Guestbook) -->
        <div id="page-doa" class="page-section hidden">
            <!-- Quote Section -->
            <!-- <section class="quote-section glass-card">
                <blockquote>
                    "Semoga Allah memberkahi usahamu, dan memberkahi umat-Nya melalui usahamu."
                </blockquote>
            </section> -->

            <section class="content-section">
                <div class="glass-card">
                    <h2>Doa & Ucapan</h2>

                    <button id="btn-open-doa" class="btn-submit" style="margin-bottom: 20px;">Tulis Doa &
                        Ucapan</button>

                    <div id="doa-list" class="doa-list">
                        <!-- Doa items will be populated here -->
                    </div>
                </div>
            </section>
        </div>

        <!-- Modal Doa -->
        <div id="modal-doa" class="modal hidden">
            <div class="modal-content glass-card">
                <span class="close-modal">&times;</span>
                <h2>Kirim Doa & Ucapan</h2>
                <form id="doa-form">
                    <div class="form-group">
                        <input type="text" id="doa-name" required placeholder="Nama Anda">
                    </div>
                    <div class="form-group">
                        <textarea id="doa-message" required
                            placeholder="Tuliskan doa atau ucapan selamat..."></textarea>
                    </div>
                    <button type="submit" class="btn-submit">Kirim Ucapan</button>
                </form>
            </div>
        </div>
        </div>
    </main>

    <!-- Floating Bottom Navbar -->
    <nav class="bottom-nav fade-in delay-2">
        <a href="#page-video" class="nav-item active" data-target="page-video">
            <span class="icon">🎥</span>
            <span class="label">Invitation</span>
        </a>
        <a href="#page-rsvp" class="nav-item" data-target="page-rsvp">
            <span class="icon">✉️</span>
            <span class="label">RSVP</span>
        </a>
        <a href="#page-doa" class="nav-item" data-target="page-doa">
            <span class="icon">🙏</span>
            <span class="label">Doa</span>
        </a>
    </nav>
    <!-- 
    <footer class="fade-in delay-3">
        <p>&copy; 2024 Grand Opening Celebration</p>
    </footer> -->

    <script src="script.js"></script>
</body>

</html>
